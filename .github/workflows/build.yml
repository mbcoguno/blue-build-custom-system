name: bluebuild
on:
  schedule:
    - cron:
        "27 20 * * *" # build at 20:27 UTC every day
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds

concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check-upstream:
    name: Check upstream image update
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_update: ${{ steps.compare.outputs.has_update }}
      state: ${{ steps.compare.outputs.state }}
      state_key: ${{ steps.recipe.outputs.state_key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get image info from recipe
        id: recipe
        run: |
          BASE_IMAGE=$(yq '.["base-image"]' recipes/recipe.yml)
          IMAGE_VERSION=$(yq '.["image-version"]' recipes/recipe.yml)
          FEDORA_VERSION="${IMAGE_VERSION##*-}"
          echo "base_image=$BASE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "image_version=$IMAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "fedora_version=$FEDORA_VERSION" >> "$GITHUB_OUTPUT"
          # Unique per run attempt, so restoring it always misses and falls
          # back to the newest cache under the prefix: the last recorded state.
          echo "state_key=upstream-state-$IMAGE_VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Get upstream image digest
        id: upstream
        run: |
          DIGEST=$(skopeo inspect --no-tags \
            "docker://${{ steps.recipe.outputs.base_image }}:${{ steps.recipe.outputs.image_version }}" \
            | jq -r '.Digest')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # Any failed fetch fails the job instead of changing the hash, so a
      # network error never triggers a scheduled build.
      - name: Check package updates
        id: packages
        shell: bash
        run: |
          # Let `set -e` (from `shell: bash`) apply inside $(...) too.
          shopt -s inherit_errexit

          # Print, one per line and sorted, the NEVRA of every package in the
          # x86_64 RPM repo at $1 that installing packages $2... from it would
          # pull in: the packages themselves plus their Requires and
          # Recommends, followed recursively, as far as the same repo can
          # satisfy them. Only the newest build of each package counts, so
          # pruning old builds from the repo doesn't change the output.
          # Packages the repo doesn't have are ignored.
          repo_package_nevras() {
            local baseurl=${1%/} href
            local -a decompress
            shift
            href=$(curl -fsSL --retry 3 --max-time 300 "$baseurl/repodata/repomd.xml" \
              | yq -p xml -o json '.repomd.data' \
              | jq -r '(if type == "array" then .[] else . end)
                       | select(."+@type" == "primary") | .location."+@href"')
            if [ -z "$href" ]; then
              echo "no primary metadata listed in $baseurl/repodata/repomd.xml" >&2
              return 1
            fi
            case "$href" in
              *.gz) decompress=(gzip -dc) ;;
              *.zst) decompress=(zstd -dc) ;;
              *.xz) decompress=(xz -dc) ;;
              *.xml) decompress=(cat) ;;
              *)
                echo "unsupported primary metadata compression: $href" >&2
                return 1
                ;;
            esac
            curl -fsSL --retry 3 --max-time 300 "$baseurl/$href" \
              | "${decompress[@]}" \
              | yq -p xml -o json '.metadata.package' \
              | jq -r --args '
                  # yq turns a single child element into an object and several into an array.
                  def arr: if type == "array" then . elif . == null then [] else [.] end;
                  # dnf installs only the newest build of each x86_64 or noarch package.
                  [ arr[] | select(.arch == "x86_64" or .arch == "noarch") ]
                  | group_by([.name, .arch])
                  | map(max_by(.time."+@build" // "0" | tonumber))
                  | [ .[]
                    | (.format | if type == "object" then . else {} end) as $f
                    | {
                        name,
                        nevra: "\(.name)-\(.version."+@epoch" // "0"):\(.version."+@ver")-\(.version."+@rel").\(.arch)",
                        provides: [.name,
                                   ($f."rpm:provides"."rpm:entry" | arr[] | ."+@name"),
                                   ($f.file | arr[] | if type == "object" then ."+content" else . end)],
                        requires: [($f."rpm:requires"."rpm:entry", $f."rpm:recommends"."rpm:entry")
                                   | arr[] | ."+@name"]
                      } ] as $pkgs
                  | (reduce $pkgs[] as $p ({}; reduce $p.provides[] as $x (.; .[$x] += [$p.name]))) as $providers
                  | (reduce $pkgs[] as $p ({}; .[$p.name] += $p.requires)) as $requires
                  | {todo: $ARGS.positional, seen: {}}
                  | until(.todo | length == 0;
                      .todo[0] as $n
                      | .todo |= .[1:]
                      | if .seen[$n] then .
                        else .seen[$n] = true | .todo += [$requires[$n][]? | $providers[.][]?]
                        end)
                  | .seen as $names
                  | [$pkgs[] | select($names[.name]) | .nevra] | unique[]
                ' "$@"
          }

          # Print, one per line and sorted, the NEVRA of the newest x86_64 or
          # noarch build of each package named in file $2 (one name per line)
          # that the RPM repo at $1 has, read from its SQLite primary
          # metadata. Names the repo doesn't have are ignored.
          repo_newest_nevras() {
            local baseurl=${1%/} names=$2 href db
            local -a decompress
            href=$(curl -fsSL --retry 3 --max-time 300 "$baseurl/repodata/repomd.xml" \
              | yq -p xml -o json '.repomd.data' \
              | jq -r '(if type == "array" then .[] else . end)
                       | select(."+@type" == "primary_db") | .location."+@href"')
            if [ -z "$href" ]; then
              echo "no primary_db metadata listed in $baseurl/repodata/repomd.xml" >&2
              return 1
            fi
            case "$href" in
              *.zst) decompress=(zstd -dc) ;;
              *.xz) decompress=(xz -dc) ;;
              *.bz2) decompress=(bzip2 -dc) ;;
              *.gz) decompress=(gzip -dc) ;;
              *)
                echo "unsupported primary_db compression: $href" >&2
                return 1
                ;;
            esac
            db=$(mktemp)
            curl -fsSL --retry 3 --max-time 300 "$baseurl/$href" | "${decompress[@]}" > "$db"
            sqlite3 -bail "$db" \
              'CREATE TABLE wanted (name TEXT)' \
              ".import --csv \"$names\" wanted" \
              "SELECT name || '-' || coalesce(epoch, '0') || ':' || version || '-' || release || '.' || arch
               FROM packages AS p
               WHERE arch IN ('x86_64', 'noarch')
                 AND name IN (SELECT name FROM wanted)
                 AND time_build = (SELECT max(time_build) FROM packages
                                   WHERE name = p.name AND arch = p.arch)
               ORDER BY 1"
            rm -f "$db"
          }

          # Print file $4 of the amd64 image ghcr.io/$1 at tag or digest $2,
          # from the layer that chunkah annotated with component $3, or
          # nothing if no layer holds that component.
          image_component_file() {
            local repo=$1 ref=$2 component=$3 path=$4 token manifest digest layer
            local accept='application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json'
            local -a decompress
            token=$(curl -fsSL --retry 3 --max-time 60 \
              "https://ghcr.io/token?scope=repository:$repo:pull" | jq -r '.token')
            manifest=$(curl -fsSL --retry 3 --max-time 60 -H "Authorization: Bearer $token" \
              -H "Accept: $accept" "https://ghcr.io/v2/$repo/manifests/$ref")
            if jq -e '.manifests' <<<"$manifest" > /dev/null; then
              digest=$(jq -r '.manifests[] | select(.platform.architecture == "amd64") | .digest' <<<"$manifest")
              manifest=$(curl -fsSL --retry 3 --max-time 60 -H "Authorization: Bearer $token" \
                -H "Accept: $accept" "https://ghcr.io/v2/$repo/manifests/$digest")
            fi
            # chunkah may pack several components into one layer; the
            # annotation then lists them separated by spaces.
            layer=$(jq -c --arg c "$component" \
              'first(.layers[] | select(.annotations["org.chunkah.component"] // ""
                                        | split(" ") | any(. == $c))) // empty' <<<"$manifest")
            if [ -z "$layer" ]; then
              return 0
            fi
            case $(jq -r '.mediaType' <<<"$layer") in
              *+zstd) decompress=(zstd -dc) ;;
              *+gzip | *.tar.gzip) decompress=(gzip -dc) ;;
              *)
                echo "unsupported layer media type: $layer" >&2
                return 1
                ;;
            esac
            curl -fsSL --retry 3 --max-time 300 -H "Authorization: Bearer $token" \
              "https://ghcr.io/v2/$repo/blobs/$(jq -r '.digest' <<<"$layer")" \
              | "${decompress[@]}" \
              | tar -xOf - "$path"
          }

          FEDORA_VER="${{ steps.recipe.outputs.fedora_version }}"
          mapfile -t PKGS < <(yq '.modules[] | select(.type == "dnf") | .install.packages[]' recipes/recipe.yml)
          mapfile -t COPRS < <(yq '.modules[] | select(.type == "dnf") | .repos.copr[]' recipes/recipe.yml)
          mapfile -t REPO_FILES < <(yq '.modules[] | select(.type == "dnf") | .repos.files[]' recipes/recipe.yml)
          METADATA=""

          # Third-party repos: compare the versions of the listed packages and
          # of what they pull in from the same repo, not the repo revision,
          # which changes whenever the repo rebuilds any package.
          for COPR in "${COPRS[@]}"; do
            BASEURL="https://download.copr.fedorainfracloud.org/results/${COPR%%/*}/${COPR##*/}/fedora-${FEDORA_VER}-x86_64"
            NEVRAS=$(repo_package_nevras "$BASEURL" "${PKGS[@]}")
            METADATA+="${NEVRAS}"$'\n'
          done

          # Repo files (local files and remote URLs)
          for REPO_REF in "${REPO_FILES[@]}"; do
            if [[ "$REPO_REF" == http* ]]; then
              REPO_TEXT=$(curl -fsSL --retry 3 --max-time 60 "$REPO_REF")
            else
              REPO_TEXT=$(cat "files/dnf/$REPO_REF")
            fi
            BASEURL=$(grep '^baseurl=' <<<"$REPO_TEXT" | head -1 | cut -d= -f2- || true)
            if [ -z "$BASEURL" ]; then
              echo "::warning::${REPO_REF} has no baseurl= line; its packages are not checked"
              continue
            fi
            BASEURL=$(echo "$BASEURL" | sed "s/\\\$releasever/$FEDORA_VER/g; s/\\\$basearch/x86_64/g; s/%OS_VERSION%/$FEDORA_VER/g")
            NEVRAS=$(repo_package_nevras "$BASEURL" "${PKGS[@]}")
            METADATA+="${NEVRAS}"$'\n'
          done

          # Fedora's own repos: every package the last build installed from
          # the fedora or updates repo, as the script module in the recipe
          # lists them in the image now tagged latest, and the newest build of
          # each in the updates repo. The fedora repo doesn't change after the
          # release, so every update lands in updates.
          IMAGE_REPO="${GITHUB_REPOSITORY_OWNER,,}/$(yq '.name' recipes/recipe.yml)"
          FEDORA_PKGS="$RUNNER_TEMP/fedora-packages"
          image_component_file "$IMAGE_REPO" latest xattr/fedora-packages \
            usr/share/blue-build-custom-system/fedora-packages > "$FEDORA_PKGS"
          if [ -s "$FEDORA_PKGS" ]; then
            NEVRAS=$(repo_newest_nevras \
              "https://dl.fedoraproject.org/pub/fedora/linux/updates/${FEDORA_VER}/Everything/x86_64" \
              "$FEDORA_PKGS")
            METADATA+="${NEVRAS}"$'\n'
          else
            echo "::warning::ghcr.io/${IMAGE_REPO}:latest lists no Fedora packages; their updates are not checked"
          fi

          # Logged so consecutive runs can be compared to see what changed.
          echo "$METADATA"
          HASH=$(echo "$METADATA" | sha256sum | cut -d' ' -f1)
          echo "dnf_hash=$HASH" >> "$GITHUB_OUTPUT"

          # 1Password: the bling module installs these two packages from this repo.
          NEVRAS=$(repo_package_nevras \
            https://downloads.1password.com/linux/rpm/stable/x86_64 1password 1password-cli)
          echo "$NEVRAS"
          HASH=$(echo "$NEVRAS" | sha256sum | cut -d' ' -f1)
          echo "onepassword_hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Restore last recorded state
        uses: actions/cache/restore@v6
        with:
          path: upstream-state.txt
          key: ${{ steps.recipe.outputs.state_key }}
          restore-keys: |
            upstream-state-${{ steps.recipe.outputs.image_version }}-

      - name: Compare with cached state
        id: compare
        run: |
          CURRENT="${{ steps.upstream.outputs.digest }}:${{ steps.packages.outputs.dnf_hash }}:${{ steps.packages.outputs.onepassword_hash }}"
          PREVIOUS=""
          if [ -f upstream-state.txt ]; then
            PREVIOUS=$(cat upstream-state.txt)
          fi
          if [ "$PREVIOUS" = "$CURRENT" ]; then
            echo "No updates detected"
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "Updates detected"
            echo "has_update=true" >> "$GITHUB_OUTPUT"
          fi
          echo "state=$CURRENT" >> "$GITHUB_OUTPUT"

  bluebuild:
    name: Build Custom Image
    needs: check-upstream
    # On schedule: only build if check-upstream detected an update; a failed
    # check builds nothing.
    # On push/PR/workflow_dispatch: always build, even if check-upstream failed.
    if: >-
      ${{ !cancelled() &&
      (needs.check-upstream.outputs.has_update == 'true' ||
      github.event_name != 'schedule') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # chunkah caps the mtime of every file it can't date from a package
      # (files in no component, big files, xattr components) at the image
      # creation time, which podman takes from SOURCE_DATE_EPOCH. Pin it to the
      # base image's creation time, so a rebuild on the same base gives these
      # files the same mtimes instead of the build time. chunkah also uses it
      # as the current time when rating how often packages change, so it must
      # stay recent; 0 would rate every package as unstable.
      # podman also writes it into the manifest's
      # org.opencontainers.image.created, which rpm-ostree takes as the
      # update's timestamp, and rpm-ostree refuses an update older than the
      # deployed image. So never pin it below the creation time of the image
      # now tagged latest, even if the base image goes back to an older build.
      - name: Pin image creation time
        shell: bash
        env:
          RECIPE: ${{ matrix.recipe }}
        run: |
          BASE_IMAGE=$(yq '.["base-image"]' "recipes/$RECIPE")
          IMAGE_VERSION=$(yq '.["image-version"]' "recipes/$RECIPE")
          IMAGE_NAME=$(yq '.name' "recipes/$RECIPE")
          LATEST_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME:latest"
          BASE_CREATED=$(skopeo inspect --no-tags "docker://$BASE_IMAGE:$IMAGE_VERSION" | jq -r '.Created')
          LATEST_CREATED=$(skopeo inspect --no-tags "docker://$LATEST_IMAGE" | jq -r '.Created')
          BASE_EPOCH=$(date -u -d "$BASE_CREATED" +%s)
          LATEST_EPOCH=$(date -u -d "$LATEST_CREATED" +%s)
          EPOCH=$((BASE_EPOCH > LATEST_EPOCH ? BASE_EPOCH : LATEST_EPOCH))
          echo "Base image created at $BASE_CREATED ($BASE_EPOCH)"
          echo "$LATEST_IMAGE created at $LATEST_CREATED ($LATEST_EPOCH)"
          echo "SOURCE_DATE_EPOCH=$EPOCH" >> "$GITHUB_ENV"

      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true
          # Push layers as zstd (BlueBuild CLI defaults to gzip), matching upstream Bazzite.
          build_opts: --compression-format zstd
          # need more runner space.
          # Cannot set more than one of 'chunkah', 'build_chunked_oci', and 'rechunk' to true.
          chunkah: true
          build_chunked_oci: false
          rechunk_clear_plan: true
          # Also applies to chunkah despite the action's description; matches upstream Bazzite.
          max_layers: 256

  record-state:
    name: Record upstream state
    needs: [check-upstream, bluebuild]
    # Record the state only after every build succeeded, so a failed or
    # cancelled build is retried by the next scheduled run.
    if: >-
      ${{ needs.check-upstream.outputs.has_update == 'true' &&
      needs.bluebuild.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Write state file
        env:
          STATE: ${{ needs.check-upstream.outputs.state }}
        run: echo "$STATE" > upstream-state.txt

      - name: Save state to cache
        uses: actions/cache/save@v6
        with:
          path: upstream-state.txt
          key: ${{ needs.check-upstream.outputs.state_key }}
