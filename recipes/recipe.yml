---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: blue-build-custom-system
# description will be included in the image's metadata
description: This is my personal OS image with my favorite tools.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/bazzite-dx
image-version: stable-45  # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  # bluebuild's akmods module support only common and nvidia(-open) groups right now.
  # zfs kernel module only support CoreOS, Centos or Fedora LTS Kernel.

  # Not apply after update. Manual add: `rpm-ostree kargs --append-if-missing=KEY=VALUE`
  # https://www.answeroverflow.com/m/1404867444320895136
  - type: kargs
    arch: x86_64  # only inject kernel arguments to these specific OS architectures
    kargs:
      # Help KVM using VFIO on Windows.
      - kvm.ignore_msrs=1
      - kvm.report_ignored_msrs=0
      # Disable USB autosuspend on Linux desktop using sleep.
      - usbcore.autosuspend=-1
      # Use full kernel preemption.
      - preempt=full

  - type: fonts
    fonts:
      nerd-fonts:
        - JetBrainsMono
        - Hasklig
        - CascadiaCode
        - ZedMono

  # TODO: Use "ublue-os/tap/1password-gui-linux" and "1password-cli" casks instead.
  - type: bling
    install:
      - 1password

  # After setup, it can diable automatic setup via `bluebuild-flatpak-manager disable all`.
  - type: default-flatpaks
    configurations:
      - notify: false # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - com.bitwarden.desktop
          - com.discordapp.Discord
          - com.github.k4zmu2a.spacecadetpinball
          - com.github.mtkennerly.ludusavi
          - com.obsproject.Studio
          - io.mpv.Mpv
          - me.proton.Mail
          - org.freac.freac
          - org.keepassxc.KeePassXC
          - org.libreoffice.LibreOffice
          - org.mozilla.thunderbird_esr
          - org.prismlauncher.PrismLauncher
          - org.sonic3air.Sonic3AIR
          # Wishlist:
          # https://github.com/flathub/flathub/pull/6775
          # https://github.com/flathub/flathub/pull/6978
          # https://github.com/flathub/flathub/pull/8359
          #
          # Branches not support in v2 because it use `flathub.org/api/v2/stats/` API.
          # - org.freedesktop.Platform.VulkanLayer.gamescope//25.08
          # - org.freedesktop.Platform.VulkanLayer.vkBasalt//25.08
          # - org.freedesktop.Platform.VulkanLayer.MangoHud//25.08
          # - org.freedesktop.Platform.VulkanLayer.OBSVkCapture//25.08
          # - org.freedesktop.Platform.VulkanLayer.lsfgvk//25.08
      - notify: false
        scope: user # Also add Flathub user repo.
        install:
          - com.usebottles.bottles
          - com.heroicgameslauncher.hgl
          - com.obsproject.Studio.Plugin.PipeWireAudioCapture

  # Snapshot the packages the base image already lists as installed from the
  # fedora or updates repo, so the script module after the dnf modules can
  # leave them out of its list of Fedora packages.
  - type: script
    snippets:
      - |
        set -o pipefail
        install -d -m 0755 /usr/share/blue-build-custom-system
        dnf5 --quiet repoquery --installed --installed-from-repo=fedora,updates --queryformat '%{name}\n' \
          | LC_ALL=C sort -u > /usr/share/blue-build-custom-system/base-fedora-packages

  # https://blue-build.org/blog/dnf-module/
  - type: dnf
    # https://github.com/boredsquirrel/browserscript-fedora-atomic
    repos:
      # Waits until warp support latest distro.
      files:
        # - https://pkg.cloudflareclient.com/cloudflare-warp-ascii.repo
        - https://repo.vivaldi.com/stable/vivaldi-fedora.repo
      # keys:
      #   # - https://pkg.cloudflareclient.com/pubkey.gpg
      copr:
        - bazzite-org/bazzite
        - secureblue/packages
        - apicalshark/fcitx5-mcbopomofo
        - scottames/ghostty
        - wezfurlong/wezterm-nightly
    install:
      packages:
        - wallpaper-engine-kde-plugin
        # - cloudflare-warp
        - vivaldi-stable
        - bubblejail
        - whipper
        - et
        - timg
        # https://github.com/ublue-os/bazzite/issues/2996
        # https://github.com/ublue-os/bazzite/issues/6101
        - fcitx5-table-extra
        - fcitx5-mcbopomofo
        - fcitx5-chewing
        - fcitx5-chinese-addons
        # kcm-fcitx5 5.1.16-1.fc45 needs libPlasma.so.7, but F45 libplasma provides libPlasma.so.8.
        # - kcm-fcitx5
        - ghostty
        - wezterm
        - kitty

  # Copy from Proton VPN meta package.
  - type: dnf
    env:
      SYSTEMD_OFFLINE: "1"
    repos:
      files:
        - protonvpn-stable.repo
    install:
      packages:
        - proton-vpn-gnome-desktop

  - type: systemd
    system:
      enabled:
        - sshd.service
        - tailscaled.service
        # - force-wol.service  # Required router support it.
    # user:
    #   enabled:
    #     # bazzite remove sunshine on 44. Use `ujust setup-sunshine` instead.
    #     - sunshine.service

  - type: script
    snippets:
      # Create folders for multiplatform package managers.
      - "install -d -m 0755 /nix /snap"
      # Give non-RPM payloads their own chunkah components so a 1Password update
      # doesn't invalidate layers holding unchanged Nerd Fonts.
      # https://github.com/coreos/chunkah#customizing-the-layers
      - "setfattr -n user.component -v nerd-fonts /usr/share/fonts/nerd-fonts && setfattr -n user.update-interval -v quarterly /usr/share/fonts/nerd-fonts"
      - "setfattr -n user.component -v 1password /usr/lib/opt/1Password && setfattr -n user.update-interval -v biweekly /usr/lib/opt/1Password"
      # chunkah stamps an xattr component's layer with the component's newest
      # mtime, capped at the image creation time (see the bluebuild job), so
      # both layers would change whenever the base image does. Zero their
      # mtimes, as the base image's are.
      - "find /usr/share/fonts/nerd-fonts /usr/lib/opt/1Password -exec touch -h -d @0 {} +"
      # The snippets below keep chunkah's layers unchanged when a rebuild
      # changes none of their files' contents, so they must run after every
      # module that installs packages or fonts.
      # fc-cache writes each font directory's mtime into its cache file, and
      # the font package's RPM trigger reruns fc-cache whenever a package adds
      # fonts. Zero every font directory's mtime, as the base image's are, and
      # rebuild every system cache last. Don't set SOURCE_DATE_EPOCH for
      # fc-cache: fontconfig 2.18.3 then deletes every system cache.
      - "find /usr/share/fonts -type d -exec touch -h -d @0 {} + && fc-cache --system-only --force"
      # Packages link their ELF files under /usr/lib/.build-id, in one of 256
      # directories named by the first two hex digits of each build ID. A
      # directory that no package installed or removed here touches keeps
      # the base image's mtime of 0, and any other gets a later one, so a
      # package update that changes which directories are touched changes
      # every layer holding a file in one of them. Zero them all; OSTree
      # deploys every mtime as 0 anyway.
      - "find /usr/lib/.build-id -type d -exec touch -h -d @0 {} +"
      # SQLite rewrites rpmdb.sqlite-shm on every rpm transaction. Move it out
      # of chunkah/unclaimed and keep it with the rpmdb, which changes on every
      # build anyway. Tagging the files, not the directory, also covers their
      # hard links in rpm-ostree-base-db.
      - "setfattr -n user.component -v rpmdb /usr/share/rpm/rpmdb.sqlite* && setfattr -n user.update-interval -v daily /usr/share/rpm/rpmdb.sqlite*"
      # List every package the dnf modules installed from the fedora or
      # updates repo, including dependencies the recipe doesn't name, for
      # check-upstream in .github/workflows/build.yml, which reads the list
      # from the image now tagged latest by its path and its component
      # (xattr/fedora-packages). dnf5 also lists packages the base image
      # installed from those repos; the script module before the dnf modules
      # saved their names, and this leaves them out, as their updates reach
      # the image only through the base image. dnf5 records where each
      # package came from in the state the next snippet deletes, so this
      # must run before it. The list's own component and zero mtimes keep its
      # layer unchanged until the list changes.
      - |
        set -o pipefail
        dnf5 --quiet repoquery --installed --installed-from-repo=fedora,updates --queryformat '%{name}\n' \
          | LC_ALL=C sort -u \
          | LC_ALL=C comm -23 - /usr/share/blue-build-custom-system/base-fedora-packages \
          > /usr/share/blue-build-custom-system/fedora-packages
        rm /usr/share/blue-build-custom-system/base-fedora-packages
        test -s /usr/share/blue-build-custom-system/fedora-packages
        cat /usr/share/blue-build-custom-system/fedora-packages
        setfattr -n user.component -v fedora-packages /usr/share/blue-build-custom-system /usr/share/blue-build-custom-system/fedora-packages
        setfattr -n user.update-interval -v monthly /usr/share/blue-build-custom-system /usr/share/blue-build-custom-system/fedora-packages
        touch -h -d @0 /usr/share/blue-build-custom-system /usr/share/blue-build-custom-system/fedora-packages
      # dnf5's transaction history would otherwise change the rpm/dnf5 layer
      # on every build; the base image deletes it too.
      - "rm -rf /usr/lib/sysimage/libdnf5/*"

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
